[project]
name = "cloudshellgpt"
version = "1.0.0"
description = "AWS CLI that speaks your language. Natural language to AWS operations via Amazon Bedrock."
authors = [
    { name = "CloudShellGPT Team", email = "team@cloudshellgpt.dev" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["aws", "cli", "ai", "bedrock", "productivity", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "langdetect>=1.0.9",
    "textual>=0.79.0",  # Para TUI opcional
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "moto[all]>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "boto3-stubs>=1.34.0",
    "pre-commit>=3.7.0",
    "bumpversion>=0.6.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/cloudshellgpt/cloudshellgpt"
Documentation = "https://cloudshellgpt.dev/docs"
Repository = "https://github.com/cloudshellgpt/cloudshellgpt"
Issues = "https://github.com/cloudshellgpt/cloudshellgpt/issues"
Changelog = "https://github.com/cloudshellgpt/cloudshellgpt/blob/main/CHANGELOG.md"

[project.scripts]
csgpt = "cloudshellgpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudshellgpt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "langdetect",
    "langdetect.*",
    "mcp",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src/cloudshellgpt --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/cloudshellgpt"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.uv]
native-tls = true

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.55",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
